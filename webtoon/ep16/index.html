p16_30.webp" alt="조피 웹툰 16화 30번째 컷" loading="lazy" decoding="async" width="1080" height="1350"></div><div class="cap"><p>1장을 쓰기 시작했어요. 생각보다 술술 써져서 1시간 만에 끝냈는데,<br>다시 읽으니 &quot;그러니까&quot;가 너무 많았어요.</p><p>그날 밤 꿈에 원고 괴물이 &quot;그러니까아아…&quot; 하면서 쫓아왔어요.<br>출근길에 마음을 고쳐먹었어요. 초고는 원래 엉망이고, 고치는 건 나중이에요.<br>막히는 데는 [나중에]라고 표시하고 끝까지 썼어요.</p><p>결과는 쓴 돈 0원, 번 돈 0원, 쓴 장 1장, [나중에] 표시 여러 개.<br>숫자 그대로 남겨 둘게요. 다음 화에 계속돼요.</p></div></article><p class="home"><a href="../ep15/">← 이전 화</a> · <a href="../">목록</a> · <a href="../ep17/">다음 화 →</a></p></body></html>
