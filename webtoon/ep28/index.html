p28_30.webp" alt="조피 웹툰 28화 30번째 컷" loading="lazy" decoding="async" width="1080" height="1350"></div><div class="cap"><p>뭉치와 나눈 대화를 정리해 봤어요.<br>그대로 받아 적으니 &quot;어… 음…&quot;이 많아서 읽기 힘들었고,<br>멋진 문장으로 바꾸니 뭉치가 사라져 버렸어요.</p><p>머그 실장님 말대로 말투는 그대로 두고 순서만 다듬었어요. 없는 말은 안 넣고요.<br>보여 줬더니 뭉치가 &quot;나 이렇게 멋있었어?&quot; 하더라고요.<br>벌통이 두 개였다는 것도 뭉치가 바로잡아 줬어요.</p><p>결과는 쓴 돈 0원, 번 돈 0원, 정리한 이야기 1편, 뭉치가 고친 사실 1개.<br>다음 화에 계속돼요.</p></div></article><p class="home"><a href="../ep27/">← 이전 화</a> · <a href="../">목록</a> · <a href="../ep29/">다음 화 →</a></p></body></html>
