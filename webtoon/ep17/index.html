17_30.webp" alt="조피 웹툰 17화 30번째 컷" loading="lazy" decoding="async" width="1080" height="1350"></div><div class="cap"><p>유난히 힘든 날이었어요. 소파가 불렀지만 딱 한 줄만 쓰기로 했어요.<br>한 줄 쓰니 두 줄, 두 줄 쓰니 한 쪽…<br>정신 차려 보니 새벽 2시였어요.</p><p>다음 날 비틀거리며 출근하다가 깨달았어요.<br>시작은 한 줄이면 충분하지만, 멈추는 시간도 정해야 해요.<br>그래서 밤 11시엔 덮기로 했어요.</p><p>결과는 쓴 돈 0원, 번 돈 0원, 목표 한 줄, 실제로는 약 한 쪽.<br>숫자 그대로 남겨 둘게요. 다음 화에 계속돼요.</p></div></article><p class="home"><a href="../ep16/">← 이전 화</a> · <a href="../">목록</a> · <a href="../ep18/">다음 화 →</a></p></body></html>
