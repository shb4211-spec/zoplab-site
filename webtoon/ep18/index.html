8_30.webp" alt="조피 웹툰 18화 30번째 컷" loading="lazy" decoding="async" width="1080" height="1350"></div><div class="cap"><p>초고를 다 쓰고 맞춤법 검사를 돌렸더니 빨간 줄이 쏟아졌어요.<br>첫 번째 적은 되/돼, 두 번째는 안/않, 세 번째는 띄어쓰기.</p><p>되/돼는 하/해를 넣어 보고, 안은 빼 보면 구분이 돼요.<br>빨간 줄을 다 지운 다음, 4화에서 배운 대로 소리 내서 읽었더니<br>검사기가 못 잡은 &quot;반듯이 → 반드시&quot;를 찾았어요.</p><p>결과는 쓴 돈 0원, 번 돈 0원, 빨간 줄 0개 될 때까지, 검사기가 놓친 것 1개.<br>숫자 그대로 남겨 둘게요. 다음 화에 계속돼요.</p></div></article><p class="home"><a href="../ep17/">← 이전 화</a> · <a href="../">목록</a> · <a href="../ep19/">다음 화 →</a></p></body></html>
