6_30.webp" alt="조피 웹툰 26화 30번째 컷" loading="lazy" decoding="async" width="1080" height="1350"></div><div class="cap"><p>첫 대화 손님은 곰 뭉치였어요.<br>진행이 처음이라 긴장했는데, 긴장하니까 오히려 말이 많아지더라고요.<br>뭉치가 꿀떡 얘기를 꺼내자마자 제 얘기를 1시간 했어요.</p><p>녹음을 들어 보니 거의 다 제 목소리였어요.<br>머그 실장이 말했어요. &quot;마이크는 손님 거예요.&quot;<br>내 얘기는 한 문장까지, 질문 다음엔 기다리기, 그리고 &quot;그래서요?&quot;</p><p>결과는 쓴 돈 0원, 번 돈 0원, 첫날 조피 말 대부분, 진행 메모 3줄.<br>다음 화에 계속돼요.</p></div></article><p class="home"><a href="../ep25/">← 이전 화</a> · <a href="../">목록</a> · <a href="../ep27/">다음 화 →</a></p></body></html>
