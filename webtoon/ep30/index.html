30_30.webp" alt="조피 웹툰 30화 30번째 컷" loading="lazy" decoding="async" width="1080" height="1350"></div><div class="cap"><p>뭉치가 말했어요. &quot;이건 내 얘기니까 남들은 안 봤으면 해.&quot;<br>그래서 책마다 고유번호를 붙이고, 그 책만의 전용 비밀번호로 잠갔어요.<br>비밀번호는 쓴 사람만 알아요.</p><p>그런데 뭉치가 비밀번호를 소리 내서 말해 버려서, 새로 정해 다시 잠갔어요.<br>초록이 열어 보려 해도 안 열리고, 뭉치가 열면 열려요.<br>쓴 사람만 볼 수 있는 책이에요.</p><p>결과는 쓴 돈 0원, 번 돈 0원, 잠근 책 1권, 다시 정한 비밀번호 1번.<br>다음 화에 계속돼요.</p></div></article><p class="home"><a href="../ep29/">← 이전 화</a> · <a href="../">목록</a> · <a href="../ep31/">다음 화 →</a></p></body></html>
