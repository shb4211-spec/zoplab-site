30.webp" alt="조피 웹툰 39화 30번째 컷" loading="lazy" decoding="async" width="1080" height="1350"></div><div class="cap"><p>퇴근길 버스에서 문득 문장 하나가 떠올랐어요.<br>잊어버리기 전에 폰 메모장에 적다 보니 한 줄, 또 한 줄.<br>다 쓰고 고개를 들었더니… 정류장을 세 개나 지나쳤더라고요.</p><p>집까지 걸어오면서도 메모는 남았다는 게 좋았어요.<br>다시 읽어 보니 좋은 것 같기도, 이상한 것 같기도.<br>일단 공책에 옮겨 두고, 판단은 내일 하기로 했어요.</p><p>결과는 쓴 돈 0원, 번 돈 0원, 쓴 시 1편, 지나친 정류장 3개.<br>숫자 그대로 남겨 둘게요. 다음 화에 계속돼요.</p></div></article><p class="home"><a href="../ep38/">← 이전 화</a> · <a href="../">목록</a> · <a href="../ep40/">다음 화 →</a></p></body></html>
