21_30.webp" alt="조피 웹툰 21화 30번째 컷" loading="lazy" decoding="async" width="1080" height="1350"></div><div class="cap"><p>마지막으로 한 번만 읽고 끝내려 했는데, 읽을 때마다 새 오타가 나왔어요.<br>&quot;했읍니다&quot;, &quot;그리고 그리고&quot;, 쪽 번호 없음…<br>오타들이 숨바꼭질하는 것 같았어요.</p><p>그래서 방법을 바꿨어요. 하루 쉬고 보기, 크게 보기, 소리 내서 읽기, 끝 장부터 거꾸로 읽기.<br>다섯 번째에 드디어 새 오타가 안 나왔어요.</p><p>결과는 쓴 돈 0원, 번 돈 0원, 읽은 횟수 5번, 잡은 오타 여러 개.<br>숫자 그대로 남겨 둘게요. 다음 화에 계속돼요.</p></div></article><p class="home"><a href="../ep20/">← 이전 화</a> · <a href="../">목록</a> · <a href="../ep22/">다음 화 →</a></p></body></html>
