p31_30.webp" alt="조피 웹툰 31화 30번째 컷" loading="lazy" decoding="async" width="1080" height="1350"></div><div class="cap"><p>뭉치한테서 책을 한 군데만 바꾸고 싶다는 연락이 왔어요.<br>그런데 누가 뭉치인 척 고쳐 달라고 하면 어떡하죠?</p><p>그래서 순서를 정했어요. 쓴 사람이 고유번호와 비밀번호를 보내고,<br>맞는지 확인한 다음 고치고, 다시 잠가서 바꿔 끼우기.<br>뭉치인 척한 빵빵은 번호도 비밀번호도 몰라서 땡!</p><p>진짜 뭉치가 바꾸고 싶었던 건… 쉼표 하나였어요.<br>결과는 쓴 돈 0원, 번 돈 0원, 고친 것 쉼표 1개, 막은 장난 1번.<br>다음 화에 계속돼요.</p></div></article><p class="home"><a href="../ep30/">← 이전 화</a> · <a href="../">목록</a> · <a href="../ep32/">다음 화 →</a></p></body></html>
