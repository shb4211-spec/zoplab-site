<script>window.SILGI={"items": [{"no": 1, "name": "비빔밥", "time": 50, "steps": ["불린 쌀로 밥부터 불에 올린다. 뜸 들이는 동안 불을 다른 작업에 쓴다.", "도라지는 소금으로 주물러 쓴맛을 빼고, 호박은 돌려깎기 후 채 썰어 살짝 절인다.", "지단은 황·백 따로 부쳐 채, 청포묵은 채 썰어 데친 뒤 소금·참기름으로 밑간.", "팬 하나로 연한 색 → 진한 색 순서로 볶기: 도라지 → 호박 → 고사리 → 고기채.", "다진 고기에 고추장·설탕·물·참기름을 넣어 윤기 나게 볶은 고추장을 만든다.", "다시마를 기름에 튀겨 튀각으로 부순다.", "그릇에 밥 → 재료 돌려 담기 → 볶은 고추장 → 튀각 순서로 마무리."], "warn": ["밥을 늦게 올려 설익음 — 덜 익은 음식은 실격 사유가 될 수 있다.", "청포묵을 채소와 같은 굵기로 썰거나, 데치지 않아 뻣뻣하고 하얗게 굳음.", "볶은 고추장이 너무 되거나 묽어 모양이 퍼지고, 나물에서 물이 나와 밥이 질척해짐."], "pdf": "hansik/1.비빔밥.pdf", "sha": "b6d25c77b5ef", "key": ["황·백지단의 크기는 0.3cm x 0.3cm x 5cm", "청포묵의 크기는 0.5cm x 0.5cm x 5cm"], "nreq": 6, "dqq": [], "matNames": ["쌀", "애호박", "도라지", "고사리", "청포묵", "소고기", "달걀", "건다시마", "고추장", "식용유", "대파", "마늘", "진간장", "흰설탕", "깨소금", "검은후춧가루", "참기름", "소금"]}, {"no": 2, "name": "콩나물밥", "time": 30, "steps": ["쌀은 체에 밭쳐 물기를 뺀다.", "콩나물 꼬리를 떼고 씻는다.", "고기 채 → 간장 양념.", "냄비에 쌀 → 콩나물 → 고기 순으로 얹고 물을 붓는다.", "끓으면 불을 줄이고, 뚜껑을 열지 않고 익힌 뒤 뜸.", "고루 섞어 전량 담기."], "warn": ["중간에 뚜껑을 자주 열어 콩나물 비린내가 남.", "물을 많이 잡아 밥이 질어짐.", "일부만 떠서 제출 — 문제에서 전량 제출을 요구한다."], "pdf": "hansik/2.콩나물밥.pdf", "sha": "bc4ccf43de6b", "key": [], "nreq": 2, "dqq": [], "matNames": ["쌀", "콩나물", "소고기", "대파", "마늘", "진간장", "참기름"]}, {"no": 3, "name": "장국죽", "time": 30, "steps": ["쌀 물기를 빼고 방망이·칼등으로 반쯤 부순다.", "고기 다지기, 표고 3cm 채 → 각각 양념.", "냄비에 참기름 두르고 고기·표고 → 쌀 순으로 볶기.", "물을 붓고 끓으면 불을 줄여 저어 가며 쑤기.", "국간장으로 색·간 → 농도 확인 후 담기."], "warn": ["쌀을 너무 곱게 부숴 풀처럼 되거나, 덜 부숴 통쌀처럼 보임.", "제출 직전에 농도를 맞춰, 담아 두는 동안 식으며 너무 되직해짐.", "바닥이 눌어 탄 냄새·검은 점이 생김."], "pdf": "hansik/3.장국죽.pdf", "sha": "273233fdd9e8", "key": ["고기는 다지고 불린 표고는 3cm"], "nreq": 2, "dqq": [], "matNames": ["쌀", "소고기", "건표고버섯", "대파", "마늘", "진간장", "깨소금", "검은후춧가루", "참기름", "국간장"]}, {"no": 4, "name": "완자탕", "time": 30, "steps": ["사태로 육수를 올린다(끓는 동안 도마 작업).", "살코기 다지고 두부 물기 짜서 섞어 양념 → 3cm 완자 빚기.", "달걀 일부로 황·백지단 부쳐 마름모 썰기.", "완자에 밀가루 → 남은 달걀물 입혀 팬에 굴려 익힌다.", "육수를 걸러 국간장·소금으로 간 → 완자 넣어 한소끔.", "그릇에 담고 지단을 띄운다."], "warn": ["완자 크기가 제각각이거나 끓이다가 부 function _old(it){return `<table><tr><th>재료</th><th>규격</th><th>수량</th></tr>${it.mats.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.spec)}${m.note?`<div class="muted">${esc(m.note)}</div>`:''}</td><td>${esc(m.qty)} ${esc(m.unit)}</td></tr>`).join('')}</table><p class="muted">※ 문제지 안내: 재료의 수급 상황에 따라 일부 지급재료가 변경될 수 있습니다.</p>`}
function dqBlock(it){return `${it.dqq.length?`<h3>이 품목 요구사항에 적힌 실격 (발췌)</h3><ul>${it.dqq.map(r=>`<li><span class="tag red">실격</span>“${esc(r)}”</li>`).join('')}</ul>`:`<p class="muted">이 품목 요구사항에는 따로 적힌 실격 문장이 없습니다. 아래 공통 실격 항목은 모든 품목에 적용됩니다.</p>`}
<h3>공통 실격 항목 (문제지 수험자 유의사항 6항)</h3><ol>${S.dq.map(d=>`<li>${esc(d)}</li>`).join('')}</ol>
<h3>감점 관련 (공개 자료에 있는 것만)</h3><ul><li>배점: 위생상태 및 안전관리 5점, 조리기술 30점, 작품의 평가 15점.</li><li>위생·안전 세부기준은 「셀프체크」 탭의 위생 표에 실격 / 전체 0점 / 일부 감점으로 정리했습니다.</li><li>요구사항 및 지급재료의 규격은 "정도"의 의미를 포함하며, 재료 크기에 따라 가감하여 채점됩니다.</li><li><span class="tag q">확인 필요</span>품목별 세부 감점 항목과 감점 크기는 공개되어 있지 않아 넣지 않았습니다.</li></ul>
${it.warn.length?`<h3>자주 하는 실수 <span class="tag">공식 아님 · ZOP LAB 연습 메모</span></h3><ul>${it.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}`}
const V={
home(){app.innerHTML=`<div class="card"><h2>집에서 혼자 하는 실기 연습</h2><p>2026년도 큐넷 공개문제에 있는 한식 <b>${S.items.length}개 품목</b>의 시험시간과 요구사항 핵심 숫자, 지급재료 이름을 한곳에 모았어요. 전체 원문은 큐넷 공개문제에서 볼 수 있게 링크를 달았어요. 모의시험 타이머, 순서 퀴즈, 셀프체크로 손에 익혀 보세요.</p>
<div class="row"><button class="btn" onclick="go('mock')">모의시험 시작</button><button class="btn ghost" onclick="go('items')">품목 보기</button></div></div>
<div class="card"><h3 style="margin-top:0">이렇게 쓰세요</h3><ol><li><b>품목</b>: 요구사항 핵심·지급재료·연습 순서·실격 포인트를 읽어요.</li><li><b>모의시험</b>: 품목 2개를 무작위로 뽑아 타이머를 돌려요.</li><li><b>순서 퀴즈</b>: 섞인 연습 순서를 맞게 눌러 봐요.</li><li><b>셀프체크</b>: 복장·위생·지참준비물을 시험 전에 확인해요.</li></ol></div>
<div class="warnbox">${DISC}<br>조리 순서와 실수 메모는 ZOP LAB이 정리한 연습용이며 공식 순서가 아닙니다. 공식 자료에서 확인하지 못한 내용은 <span class="tag q">확인 필요</span>로 표시했습니다.</div>${SRC}`},
items(q=''){app.innerHTML=`<input type="search" id="q" placeholder="품목 검색 (예: 구이, 전, 생채)" value="${esc(q)}"><p class="muted">${S.items.length}개 품목 · 번호는 큐넷 공개문제 번호</p><div class="list" id="ls"></div>`;
 const draw=()=>{const k=$('#q').value.trim();$('#ls').innerHTML=S.items.filter(i=>!k||i.name.includes(k)).map(i=>`<button class="it" data-n="${i.no}"><b>${i.no}. ${esc(i.name)}</b><span>${i.time}분 · 재료 ${i.matNames.length}가지${i.dqq.length?' · <span style="color:var(--red)">실격 문구 있음</span>':''}</span></button>`).join('')||'<p class="muted">검색 결과가 없어요.</p>'};
 $('#q').oninput=draw;draw();$('#ls').onclick=e=>{const b=e.target.closest('.it');if(b)V.item(+b.dataset.n)}},
item(n,tab='req'){const it=S.items.find(i=>i.no==n);const T={req:'요구사항',mat:'지급재료',step:'연습 순서',dq:'실격·감점',ck:'셀프체크'};
 const body={req:keyBlock(it)+SRC,
 mat:matsTable(it)+SRC,
 step:`${ZOP}<ol>${it.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="muted">큐넷 공개문제에는 조리 순서가 나와 있지 않습니다. 이 순서는 연습용 예시이며, 요구사항과 다르면 요구사항을 따르세요.</p>`,
 dq:dqBlock(it)+SRC,
 ck:`<p class="muted">완성 직전, 요구사항을 하나씩 확인해요. (기기 안에만 저장)</p>${it.key.map((r,i)=>ckRow('it'+n+'_'+i,'규격 확인: '+r)).join('')}${ckRow('it'+n+'_all','큐넷 원문의 요구사항 '+it.nreq+'개를 모두 다시 읽었다')}${ckRow('it'+n+'_dq','공통 실격 항목(수량, 다른 요리, 타거나 덜 익음, 지급재료 외 사용, 화구 2개 이상 등)에 해당하지 않는다')}<button class="btn sm ghost" style="margin-top:10px" onclick="clearCk('it${n}_');V.item(${n},'ck')">체크 지우기</button>`};
 app.innerHTML=`<button class="btn sm ghost" onclick="go('items')">← 품목 목록</button><div class="card" style="margin-top:10px"><span class="tag">${it.no}번</span><span class="tag">시험시간 ${it.time}분</span><h2 style="margin-top:6px">${esc(it.name)}</h2><div class="tabs">${Object.entries(T).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="V.item(${n},'${k}')">${v}</button>`).join('')}</div>${body[tab]}</div>
 <div class="row"><button class="btn sm gd" onclick="go('quiz',${n})">이 품목 순서 퀴즈</button></div>`;bindCk()},
mock(){app.innerHTML=`<div class="card"><h2>모의시험</h2><p>품목 2개를 무작위로 뽑아 타이머를 돌려요. <span class="tag">연습용 임의 조합</span></p>
 <p class="muted">실제 시험의 과제 조합은 시험장에서 정해집니다. 이 연습은 두 품목 시험시간을 더한 시간으로 진행해요. <span class="tag q">확인 필요</span>두 과제 시간을 합산해 진행하는지는 큐넷 공개문제에 적혀 있지 않습니다. 응시 전에 시험장 안내로 확인하세요.</p>
 <div id="pick"></div><div class="row"><button class="btn" id="draw">다시 뽑기</button><button class="btn gd" id="start">이 조합으로 시작</button></div></div>`;
 let pair;const draw=()=>{const a=[...S.items].sort(()=>Math.random()-.5);pair=[a[0],a[1]];$('#pick').innerHTML=pair.map(i=>`<div class="card" style="background:#faf8f3"><b>${i.no}. ${esc(i.name)}</b> <span class="tag">${i.time}분</span><div class="muted">요구사항 ${i.nreq}개 · 재료 ${i.matNames.length}가지</div></div>`).join('')+`<p><b>합계 ${pair[0].time+pair[1].time}분</b></p>`};
 draw();$('#draw').onclick=draw;$('#start').onclick=()=>V.run(pair)},
run(pair){const total=(pair[0].time+pair[1].time)*60;let left=total,paused=false,sub=[0,0];
 app.innerHTML=`<div class="card"><div class="timer" id="tm">${fmt(left)}</div><div class="bar"><i id="br" style="width:100%"></i></div>
 <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost sm" id="pz">일시정지</button><button class="btn ghost sm" id="end">그만하기</button></div>
 <p class="muted" style="text-align:center">공통 실격 항목: 가스레인지 화구 2개 이상 사용 · 조리 중 맛보지 않기(유의사항)</p></div>
 ${pair.map((it,k)=>`<div class="card"><div class="row" style="justify-content:space-between"><h2>${esc(it.name)} <span class="tag">${it.time}분</span></h2><button class="btn sm" id="sb${k}">제출</button></div>
 <details><summary>요구사항 핵심</summary>${keyBlock(it)}</details>
 <details><summary>지급재료 (${it.matNames.length})</summary>${matsTable(it)}</details>
 <h3>연습 순서 ${ZOP}</h3>${it.steps.map((s,i)=>ckRow('run'+k+'_'+i,s,true)).join('')}</div>`).join('')}`;
 const tick=()=>{if(paused)return;left--;$('#tm').textContent=fmt(left);$('#tm').classList.toggle('low',left<300);$('#br').style.width=(left/total*100)+'%';if(left<=0)finish()};
 const finish=()=>{clearInterval(timer);V.result(pair,sub,total-left,total)};
 timer=setInterval(tick,1000);$('#pz').onclick=e=>{paused=!paused;e.target.textContent=paused?'계속':'일시정지'};$('#end').onclick=finish;
 pair.forEach((_,k)=>$('#sb'+k).onclick=e=>{sub[k]=1;e.target.disabled=1;e.target.textContent='제출함';if(sub[0]&&sub[1])finish()});bindCk()},
result(pair,sub,used,total){const all=sub[0]&&sub[1];
 app.innerHTML=`<div class="card"><h2>연습 끝</h2><p>사용한 시간 <b>${fmt(used)}</b> / ${fmt(total)}</p>
 ${all?'<p>두 품목을 모두 시간 안에 제출했어요.</p>':`<div class="warnbox">아직 제출하지 않은 품목이 있어요. 문제지 공통 실격 항목에 "시험시간 내에 과제 두 가지를 제출하지 못한 경우"가 있으니, 다음 연습에서는 두 품목을 모두 시간 안에 내 보세요.</div>`}
 <h3>스스로 점검</h3>${pair.map(it=>it.key.map(r=>ckRow('',`[${it.name}] ${r}`,true)).join('')+ckRow('',`[${it.name}] 큐넷 원문 요구사항 ${it.nreq}개와 비교해 봤다`,true)).join('')}
 <div class="row" style="margin-top:12px"><button class="btn" onclick="go('mock')">한 판 더</button><button class="btn ghost" onclick="go('check')">위생 셀프체크</button></div>
 <p class="muted">${DISC}</p></div>`;bindCk()},
quiz(n){const pool=S.items.filter(i=>i.steps.length>=3);let it=n?S.items.find(i=>i.no==n):pool[Math.random()*pool.length|0];
 const order=it.steps.map((s,i)=>i).sort(()=>Math.random()-.5);let next=0,miss=0;
 app.innerHTML=`<div class="card"><h2>순서 퀴즈 · ${esc(it.name)}</h2>${ZOP}<p class="muted">먼저 할 일부터 차례로 눌러 보세요. 정답은 ZOP LAB 연습 순서 기준이며 공식 순서가 아닙니다.</p><div id="qs">${order.map(i=>`<button class="qopt" data-i="${i}">${esc(it.steps[i])}</button>`).join('')}</div><p id="qm" class="muted"></p>
 <div class="row"><button class="btn gd" onclick="go('quiz')">다른 품목</button><button class="btn ghost" onclick="V.item(${it.no},'step')">순서 보기</button></div></div>`;
 $('#qs').onclick=e=>{const b=e.target.closest('.qopt');if(!b||b.classList.contains('done'))return;if(+b.dataset.i==next){b.classList.add('done');b.textContent=(next+1)+'. '+it.steps[next];next++;if(next==it.steps.length)$('#qm').textContent=`완료! 틀린 횟수 ${miss}번.`}else{miss++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad')}}},
check(){app.innerHTML=`<div class="card"><h2>위생·복장 셀프체크</h2><p class="muted">「위생상태 및 안전관리 세부기준별 채점기준 안내」(큐넷, 조리분야 공통) 내용을 연습용으로 줄였어요. 체크는 이 기기에만 저장돼요.</p>
 <table><tr><th>구분</th><th>이런 경우</th><th>채점기준</th></tr>${S.hyg.map(h=>`<tr><td>${esc(h[0])}</td><td>${esc(h[1])}</td><td><span class="tag ${h[2]=='실격'?'red':''}">${esc(h[2])}</span></td></tr>`).join('')}</table>
 <h3>시험 전 내 복장 점검</h3>${['위생복 상의: 전체 흰색, 손목까지 오는 긴소매, 화재에 취약한 재질 아님','위생복 하의: 발목까지 오는 긴바지(색상 무관)','위생모: 전체 흰색, 빈틈없이 마감, 머리카락이 보이지 않음','앞치마: 전체 흰색, 무릎 아래까지','마스크(입가리개) 착용','위생화: 굽이 높지 않고 발가락·발등·뒤꿈치가 덮임','장신구 없음(위생모 고정용 머리핀만)','손톱 짧게, 매니큐어·인조 손톱 없음, 상처는 밴드 등으로 조치','복장의 소속·성명은 테이프로 가림, 조리기구에는 이름 표기 없음'].map((t,i)=>ckRow('hy'+i,t)).join('')}
 <p class="muted">기타 안내: 교차오염 방지를 위한 칼·도마 구분 사용은 세척으로 대신할 수 있고, 눈금 표시된 조리기구 사용은 실격 처리되지 않습니다(재료 썰기에서 눈금에 의존하면 채점에 반영).</p></div>
 <div class="card"><h2>지참준비물 ${S.jich.length}가지</h2><p class="muted">큐넷 「수험자 지참 준비물 조회」 한식조리기능사 2026년 상시검정 목록(2026-10-18 조회). 응시 전에 최신 목록을 다시 보세요. <a href="${S.src.jicham}" target="_blank" rel="noopener">큐넷 목록</a></p>
 ${S.jich.map((j,i)=>ckRow('ji'+i,`${j[0]}${j[1]?' ('+j[1]+')':''}${j[2]?' · '+j[2]:''}`)).join('')}
 <button class="btn sm ghost" style="margin-top:10px" onclick="clearCk('hy');clearCk('ji');go('check')">체크 모두 지우기</button></div>`;bindCk()}
};
function ckRow(id,t,tmp){const on=!tmp&&LS.get('ck',{})[id];return `<label class="ck"><input type="checkbox" data-ck="${tmp?'':id}" ${on?'checked':''}><span>${esc(t)}</span></label>`}
function bindCk(){document.querySelectorAll('input[data-ck]').forEach(c=>c.onchange=()=>{if(!c.dataset.ck)return;const m=LS.get('ck',{});m[c.dataset.ck]=c.checked;LS.set('ck',m)})}
function clearCk(p){const m=LS.get('ck',{});Object.keys(m).forEach(k=>{if(k.startsWith(p))delete m[k]});LS.set('ck',m)}
V.home();
</script>
<div class="foot">© ZOP LAB · 연습용 도구이며 공식 채점이 아닙니다</div></body></html>
