<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>한 권 레이블 서가 · 잡랩 북스</title><meta name="robots" content="noindex">
<style>@font-face{font-family:G;src:url(Gaegu-Bold.ttf)}*{box-sizing:border-box;margin:0}
body{background:#f3efe4;color:#1f2a24;font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;padding:36px 18px 60px;max-width:760px;margin:auto}
.g{font-family:G}header{text-align:center;margin-bottom:28px}.top{font-size:20px}.top b{color:#b6533a}
h1{font-family:G;font-size:46px;line-height:1.1;margin:6px 0}.sub{color:#b6533a;font-weight:700;font-size:14px}
h2{font-family:G;font-size:28px;margin:34px 0 12px;border-bottom:2px solid #b39c6d;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;padding:10px;box-shadow:5px 5px 0 #1f2a24;color:inherit;text-decoration:none;display:block}
.card img{width:100%;aspect-ratio:3/4.2;object-fit:cover;border-radius:6px;background:#eee}
.no{font-family:G;color:#b6533a;font-size:20px;margin-top:6px}.t{font-weight:700;font-size:14px}.m{font-size:12px;color:#777}.l{font-size:12px;margin-top:4px}
.free{display:inline-block;border:1px solid #b6533a;color:#b6533a;font-size:11px;padding:0 6px;margin-top:6px}.pv{display:inline-block;margin-left:6px;font-size:12px;color:#1f2a24}
.slot{border:3px dashed #b39c6d;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:260px;text-decoration:none;color:#1f2a24;padding:12px}
.slot .no{font-size:26px}.note{text-align:center;font-size:13px;margin-top:26px;color:#555}


footer{text-align:center;font-size:12px;color:#b39c6d;margin-top:30px;letter-spacing:2px}</style></head><body>
<header><div class="top g">「내 인생 한 권」 <b>×</b> 잡랩 북스</div><h1>한 권 레이블 서가</h1><div class="sub">잡랩 북스 · 평범한 사람 이야기만 내는 작은 책 레이블</div></header>
<h2>레이블 책</h2><div class="grid" id="label"></div>
<h2>참여자 서가</h2><div class="grid" id="part"></div>
<p class="note">서가에는 주인이 동의한 책만 올라와요. 모두 비매품이에요.</p>
<footer>ZOP LAB · 잡랩 북스 · 한 권 레이블</footer>
<script src="books.js"></script><script>
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function card(b){return `<div class="card"><img src="${esc(b.cover)}" alt="『${esc(b.title)}』 표지" loading="lazy"><div class="no">No.${esc(b.no)}</div><div class="t">『${esc(b.title)}』</div><div class="m">지은이 ${esc(b.author)}${b.date?" · "+esc(b.date):""}</div>${b.line?`<div class="l">${esc(b.line)}</div>`:""}<span class="free">비매품</span>${b.preview?`<a class="pv" href="${esc(b.preview)}">미리보기 →</a>`:""}</div>`}
document.getElementById("label").innerHTML=LABEL_BOOKS.map(card).join("");
var P=PARTICIPANT_BOOKS,next=String(3+P.length).padStart(3,"0");
document.getElementById("part").innerHTML=P.map(card).join("")+`<a class="slot" href="/lab/"><div class="no">No.${next}</div><div class="t">다음 책은<br>당신 차례</div><div class="m" style="margin-top:6px">「내 인생 한 권」 알아보기 →</div></a>`;
</script></body></html>
